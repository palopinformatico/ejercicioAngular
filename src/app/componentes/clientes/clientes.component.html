
  <h1>Clientes</h1>
  <table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
      <th>Teléfono</th>
      <th>Pais Origen</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cliente of clientes">
      <td>{{ cliente.id }}</td>
      <td>{{ cliente.nombre }}</td>
      <td>{{ cliente.email }}</td>
      <td>{{ cliente.telefono | formatoTelefono }}</td>
      <td>{{ cliente.paisOrigen }}</td>
    </tr>
  </tbody>
</table>
